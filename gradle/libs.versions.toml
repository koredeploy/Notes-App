roomDatabase = { group = "androidx.room", name = "room-runtime", version.ref = "roomVersion"}
roomCompiler = { group =  "androidx.room", name = "room-compiler", version.ref = "roomVersion" }
roomKtx = { group =  "androidx.room", name = "room-ktx", version.ref = "roomVersion" }
prefrencedatastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStoreVersion"}
protodatastore = { group = "androidx.datastore", name = "datastore", version.ref = "dataStoreVersion"}


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
hilt= { id = "com.google.dagger.hilt.android", version.ref = "hiltVersion"}
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
roomcompiler = { id = "androidx.room", version.ref = "roomVersion"}


